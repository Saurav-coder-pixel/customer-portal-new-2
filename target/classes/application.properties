spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${ORACLE_DB_URL:jdbc:oracle:thin:@//tndexaccvm-scan.crisexacc.org:1521/test.crisexacc.org}
spring.datasource.username=${ORACLE_DB_USERNAME:tms3t}
spring.datasource.password=${ORACLE_DB_PASSWORD:tms3t}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=none

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload-dir=uploads/gstin

spring.mail.host=${CRIS_SMTP_HOST}
spring.mail.port=${CRIS_SMTP_PORT:25}
spring.mail.username=${CRIS_MAIL_USERNAME}
spring.mail.password=${CRIS_MAIL_PASSWORD}

# Internal CRIS relay configuration
# TODO: Confirm with CRIS IT/infra team if auth is actually required.
# Some internal relays allow unauthenticated relay from trusted internal IPs.
spring.mail.properties.mail.smtp.auth=true

# Set to false unless CRIS confirms TLS/SSL is required - internal relays commonly don't use it
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false


<div class="app-layout">
    <!-- ── Global watermark layer: sits behind everything ── -->
    <div class="ir-watermark" style="background-image: url('assets/images/rail.png')" aria-hidden="true"></div>
    <header>
        <div class="brand" style="display: flex; align-items: center; gap: 14px;">
            <button class="drawer-toggle-btn" (click)="toggleDrawer()" aria-label="Toggle Navigation">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            </button>
            <div class="cris"><img src="assets/images/cris-logo.png" alt="CRIS – making IT happen" /></div>
            <span>CUSTOMER REGISTRATION PORTAL</span>
        </div>
        <div class="cris"><img src="assets/images/cris-logo.png" alt="CRIS – making IT happen" /></div>
    </header>

    <div class="layout-body">
        <aside class="drawer" [class.open]="isDrawerOpen" [class.collapsed]="!isDrawerOpen">
            <div class="drawer-nav">
                <button class="drawer-item" routerLink="/register" routerLinkActive="active">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Home
                </button>
                <button class="drawer-item" routerLink="/verify" routerLinkActive="active">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Verification Screen
                </button>
            </div>
        </aside>

        <div class="layout-main-content">
            <router-outlet></router-outlet>
            <footer>Copyright©2026. Designed and Developed by Centre for Railway Information Systems (CRIS)</footer>
        </div>
    </div>
</div>

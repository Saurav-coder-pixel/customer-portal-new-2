<div class="login-app">
  <header class="login-header">
    <div class="login-brand"><div class="login-cris">
      <img src="assets/images/cris-logo.png" alt="CRIS" />
    </div></div>
    <span class="login-title">Create Account</span>
    <div class="login-cris"><img src="assets/images/cris-logo.png" alt="CRIS" /></div>
  </header>

  <main class="login-main">
    <div class="login-card">
      <div class="login-card-head">
        <div class="login-railways-banner">
          <img src="assets/images/indian-railways-logo.png" alt="Indian Railways" />
        </div>
      </div>
      <div class="login-rule"></div>

      <div *ngIf="error" class="login-error-banner">{{ error }}</div>
      <div *ngIf="success" class="login-success-banner">{{ success }}</div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-grid" autocomplete="off">
        <div class="login-field-wrap">
          <label for="su-email">Email <b>*</b></label>
          <div class="login-control">
            <input id="su-email" type="email" placeholder="Enter Email" formControlName="email" />
          </div>
        </div>

        <div class="login-field-wrap">
          <label for="su-user">Username <b>*</b></label>
          <div class="login-control">
            <input id="su-user" type="text" placeholder="Enter Username" formControlName="username" />
          </div>
        </div>

        <div class="login-field-wrap">
          <label for="su-pass">Password <b>*</b></label>
          <div class="login-control">
            <input id="su-pass" [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter Password" formControlName="password" />
            <button type="button" class="login-pw-toggle" (click)="showPassword = !showPassword">
              {{ showPassword ? '&#128584;' : '&#128065;' }}
            </button>
          </div>
        </div>

        <div class="login-field-wrap">
          <label for="su-confirm">Confirm Password <b>*</b></label>
          <div class="login-control">
            <input id="su-confirm" [type]="showConfirm ? 'text' : 'password'"
              placeholder="Confirm Password" formControlName="confirmPassword" />
            <button type="button" class="login-pw-toggle" (click)="showConfirm = !showConfirm">
              {{ showConfirm ? '&#128584;' : '&#128065;' }}
            </button>
          </div>
        </div>

        <div class="login-actions">
          <div class="login-btns">
            <button type="submit" class="login-submit" [disabled]="loading">
              {{ loading ? 'Creating...' : 'Create Account' }}
            </button>
            <button type="button" class="login-reset" (click)="goLogin()" [disabled]="loading">
              Sign In
            </button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <footer class="login-footer">
    Designed and Developed By <strong>CENTRE FOR RAILWAY INFORMATION SYSTEMS</strong> Chanakyapuri, New Delhi-110021
  </footer>
</div>
